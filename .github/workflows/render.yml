name: PrimeScope FFmpeg Render

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload generated by PrimeScope n8n'
        required: true
        type: string

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: primescope-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out renderer
        uses: actions/checkout@v4
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check --quiet --break-system-packages requests gdown
      - name: Build six-scene video
        env:
          PRIMESCOPE_PAYLOAD: ${{ inputs.payload }}
        run: python scripts/render.py
      - name: Publish MP4 as public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(cat out/tag.txt)"
          test -f "out/${TAG}.mp4"
          gh release create "$TAG" "out/${TAG}.mp4" \
            --target "${GITHUB_SHA}" \
            --title "PrimeScope video $TAG" \
            --notes "Automated 60-second video. Review before publishing to social networks." \
            --latest=false
